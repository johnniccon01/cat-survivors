<h1>Mačky po úprave</h1>
<p>Skutočné sprity z hry, kreslené rovnakým výpočtom ako v hre: dýchanie, švihnutie chvostom, žmurkanie, pri chôdzi náklon a pruženie. Krídla, svätožiara, rohy a čiapka sa v hre kreslia navyše a tu chýbajú.</p>

let moving=false,slow=1;
const Z=6,W=56,H=48;
const g=document.getElementById('g');
CATS.forEach((c,i)=>{c.seed=i*131+7;const d=document.createElement('div');d.className='c';
 const cv=document.createElement('canvas');cv.width=W*Z;cv.height=H*Z;d.appendChild(cv);
 d.insertAdjacentHTML('beforeend','<div class="n">'+c.name+'</div><div class="x">'+(c.extra.length?'v hre navyše: '+c.extra.join(', '):'&nbsp;')+'</div>');
 g.appendChild(d);c.cv=cv;c.im=new Image();c.im.src=c.img;});
function life(walkT,t,seed){t+=(seed%997)*0.37;let sq,lean=0,col;
 if(moving){sq=Math.sin(walkT*Math.PI/1.6)*0.045;lean=0.07+Math.sin(walkT*Math.PI/3.2)*0.02;col=Math.floor(walkT/1.6)%4;}
 else{sq=Math.sin(t*2.4)*0.035;col=(t%2.6)>2.0?3:1;}
 const blink=(t%(3.4+(seed%7)*0.3))<0.14;return{sq,lean,col,blink};}
let walkT=0,last=performance.now(),clock=0;
function frame(now){const dt=(now-last)/1000/slow;last=now;clock+=dt;walkT+=dt*(moving?12:3);
 CATS.forEach(c=>{const x=c.cv.getContext('2d');x.imageSmoothingEnabled=false;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.cv.width,c.cv.height);
  if(!c.im.complete)return;const L=life(walkT,clock,c.seed);const s=c.size;
  const ox=W/2*Z,oy=(H*0.62)*Z;
  x.fillStyle='rgba(0,0,0,0.25)';x.beginPath();x.ellipse(ox,oy+9*s*Z,9*s*Z,2.5*s*Z,0,0,7);x.fill();
  const feet=11*s;const sx=(1-L.sq*0.5),sy=(1+L.sq);const r=L.lean;
  const a=Math.cos(r)*sx*Z,b=Math.sin(r)*sx*Z,cc=-Math.sin(r)*sy*Z,dd=Math.cos(r)*sy*Z;
  const tx=ox-(cc*feet),ty=oy+feet*Z-(dd*feet);
  x.setTransform(a,b,cc,dd,tx,ty);
  const row=L.blink?4:0;const [cw,ch]=c.cell;const [ax,ay]=c.anchor;
  x.drawImage(c.im,L.col*cw,row*ch,cw,ch,-ax,-ay,cw,ch);});
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
const bi=document.getElementById('idle'),bw=document.getElementById('walk'),bs=document.getElementById('slow');
bi.onclick=()=>{moving=false;bi.classList.add('on');bw.classList.remove('on')};
bw.onclick=()=>{moving=true;bw.classList.add('on');bi.classList.remove('on')};
bs.onclick=()=>{slow=slow===1?4:1;bs.classList.toggle('on',slow===4)};
