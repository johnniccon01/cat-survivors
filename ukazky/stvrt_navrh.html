<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Štvrť – návrh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f2c14e;--gold2:#c8902a;--ink:#14101a;--panel:#211b2b;--panel2:#18131f;--line:#4a3f5c;--txt:#f4ecdc;--mut:#a59cb4;--red:#e0503f;--green:#7cc455}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0910;overflow:hidden}
body{font-family:Nunito,system-ui,sans-serif;color:var(--txt)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;
 background:radial-gradient(ellipse at 50% 0%,#2a2140 0%,#120e18 60%,#0b0910 100%)}
.px{font-family:'Pixelify Sans',monospace}
#top{position:absolute;left:16px;top:10px;width:1248px;height:46px;display:flex;align-items:center;gap:22px;padding:0 16px;
 background:linear-gradient(#2b2338,#1c1626);border:2px solid var(--line);border-radius:10px;box-shadow:0 4px 0 #0a0810,inset 0 1px 0 #ffffff14}
#top .title{font-size:26px;font-weight:700;color:var(--gold);text-shadow:0 2px 0 #6a4510,0 0 12px #f2c14e55;letter-spacing:1px}
.chip{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--txt)}
.chip small{color:var(--mut);font-size:13px}
.chip canvas{image-rendering:pixelated}
.nem .px{font-family:Nunito;font-weight:700}.nem{padding:3px 10px 3px 4px;border-radius:8px;background:linear-gradient(#4a1c1c,#2a1012);border:1px solid #8a3030;color:#ffb3a8}
.gold{margin-left:auto;color:var(--gold);font-weight:700}
#mapwrap{position:absolute;left:16px;top:66px;width:904px;height:516px;border-radius:12px;padding:6px;
 background:linear-gradient(#5a3e26,#3a2717);box-shadow:0 6px 0 #0a0810,0 0 0 2px #1a120a,inset 0 0 0 2px #8a6236}
#mapin{position:relative;width:892px;height:504px;border-radius:7px;overflow:hidden;box-shadow:inset 0 0 0 2px #c8902a66}
#map{width:892px;height:504px;image-rendering:pixelated;display:block}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,#05040a99 100%)}
.pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 3px 0 #0008)}
.plate{background:linear-gradient(#2c2438ee,#16111ee8);border:2px solid #5a4a6e;border-radius:7px;padding:2px 9px 3px;text-align:center;white-space:nowrap;transition:transform .15s}
.pin:hover .plate{transform:translateY(-2px);border-color:var(--gold)}
.plate .nm{font-family:'Pixelify Sans';font-size:15px;font-weight:600;line-height:1.1}
.plate .st{font-size:12px;letter-spacing:1px;color:var(--gold);line-height:1}
.plate .st i{color:#5d5468;font-style:normal}
.pin.you .plate{border-color:#3f9a78}.pin.you .nm{color:#bff0dc}
.pin.enemy .plate{border-color:#9a4a3a}.pin.enemy .nm{color:#ffd0c4}
.pin.locked .plate{border-color:#55505e;opacity:.85}.pin.locked .nm{color:#c9c2d4}
.pin.sel .plate{border-color:var(--gold);box-shadow:0 0 0 2px #f2c14e55,0 0 18px #f2c14e88}
.flag{width:2px;height:14px;background:#2a1c10;position:relative;margin-top:-1px}
.flag:after{content:"";position:absolute;left:2px;top:0;width:13px;height:9px;background:var(--fc,#3f9a78);clip-path:polygon(0 0,100% 0,78% 50%,100% 100%,0 100%);animation:wave 1.2s ease-in-out infinite}
@keyframes wave{50%{transform:skewY(6deg) scaleX(.9)}}
.rep{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
 font-family:'Pixelify Sans';font-weight:700;font-size:19px;color:#fff;border:2px solid #fff;animation:bob 1.6s ease-in-out infinite;box-shadow:0 3px 0 #0008,0 0 16px var(--rc)}
.rep.def{background:#c0392b;--rc:#ff5a4a}.rep.trip{background:#d49a1c;--rc:#f2c14e;color:#3a2600}.rep.opp{background:#2f8a6a;--rc:#5fe0b0}
@keyframes bob{50%{transform:translate(-50%,-62%)}}
.ring{position:absolute;width:64px;height:64px;border-radius:50%;border:3px solid var(--gold);transform:translate(-50%,-50%);pointer-events:none;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
.legend{position:absolute;right:12px;bottom:10px;display:flex;gap:10px;background:#140f1cd9;border:1px solid #4a3f5c;border-radius:8px;padding:5px 10px;font-size:12px;color:var(--mut)}
.legend b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;color:#fff;font-family:'Pixelify Sans';font-size:12px;margin-right:4px;vertical-align:-4px}
#panel{position:absolute;left:932px;top:66px;width:332px;height:516px;border-radius:12px;overflow:hidden;
 background:linear-gradient(#272033,#17121f);border:2px solid var(--line);box-shadow:0 6px 0 #0a0810,inset 0 1px 0 #ffffff12;display:flex;flex-direction:column}
#thumbw{position:relative;height:150px;flex:none;border-bottom:2px solid var(--line)}
#thumb{width:100%;height:150px;image-rendering:pixelated;display:block}
#thumbw:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#17121fee)}
#badge{position:absolute;left:10px;top:10px;z-index:2;font-family:'Pixelify Sans';font-size:14px;padding:3px 10px;border-radius:6px;border:2px solid #fff3}
#ptitle{position:absolute;left:14px;bottom:8px;z-index:2;font-family:'Pixelify Sans';font-size:30px;font-weight:700;text-shadow:0 3px 0 #000a}
.pbody{padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px;flex:1}
#story{font-size:14px;line-height:1.45;color:#ddd3e8;min-height:40px}
.boss{display:flex;align-items:center;gap:10px;background:#120e18;border:1px solid #3a3148;border-radius:8px;padding:6px 8px}
.boss canvas{width:46px;height:46px;image-rendering:pixelated;background:#2a1f2e;border-radius:6px}
.boss .bn{font-family:'Pixelify Sans';font-size:16px}
.boss .bt{font-size:12px;color:var(--mut)}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:#5a1c1c;color:#ffb3a8;border:1px solid #9a3a3a;margin-left:6px;font-family:Nunito}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:#120e18;border:1px solid #3a3148;border-radius:7px;padding:4px 8px}
.stat small{display:block;font-size:11px;color:var(--mut)}
.stat span{font-family:'Pixelify Sans';font-size:15px}
.box{border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.35}
.box small{display:block;font-size:11px;opacity:.8;margin-bottom:1px}
.win{background:linear-gradient(#1f3a1a,#142812);border:1px solid #3f7a2a;color:#d6f5c4}
.lose{background:linear-gradient(#3a1a1a,#28100f);border:1px solid #7a2f2a;color:#ffd0c8}
#bottom{position:absolute;left:16px;top:594px;width:1248px;height:114px;border-radius:12px;display:flex;align-items:center;gap:14px;padding:0 14px;
 background:linear-gradient(#211b2b,#120e18);border:2px solid var(--line);box-shadow:0 6px 0 #0a0810}
#cats{display:flex;gap:8px}
.cat{position:relative;width:72px;height:90px;border-radius:9px;background:linear-gradient(#2e2640,#1d1828);border:2px solid #3e3450;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:transform .12s}
.cat:hover{transform:translateY(-3px);border-color:#7a6a92}
.cat canvas{width:68px;height:62px;image-rendering:pixelated}
.cat .cn{font-size:11.5px;font-weight:700;color:#e8e0f0;margin-top:-2px}
.cat.sel{border-color:var(--gold);box-shadow:0 0 0 2px #f2c14e44,0 0 16px #f2c14e66;transform:translateY(-4px)}
.cat .home{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#3a2600;font-size:12px;display:none;place-items:center;border:2px solid #3a2600;font-weight:800}
.cat.isHome .home{display:grid}
#catinfo{width:250px;padding-left:6px}
#catinfo .n{font-family:'Pixelify Sans';font-size:22px;font-weight:700}
#catinfo .h{font-size:13px;color:var(--gold);min-height:18px}
#catinfo .w{font-size:12.5px;color:var(--mut)}
#go{margin-left:auto;width:220px;height:84px;border-radius:12px;border:none;cursor:pointer;position:relative;
 background:linear-gradient(#ffd977,#f2b33a 55%,#c9861c);box-shadow:0 6px 0 #7a4d0c,0 0 24px #f2c14e55,inset 0 2px 0 #fff8;color:#3a2100;
 font-family:'Pixelify Sans';font-weight:700;font-size:32px;text-shadow:0 1px 0 #ffe9a8;animation:glow 2s ease-in-out infinite}
#go small{display:block;font-family:Nunito;font-size:13px;font-weight:700;color:#6a4310;text-shadow:none}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 #7a4d0c}
@keyframes glow{50%{box-shadow:0 6px 0 #7a4d0c,0 0 36px #f2c14e99,inset 0 2px 0 #fff8}}
.modes{display:flex;gap:4px;margin-left:auto}
.modes span{font-size:12px;padding:3px 9px;border-radius:6px;background:#120e18;border:1px solid #3a3148;color:var(--mut)}
.modes span.on{background:var(--gold);color:#3a2600;border-color:var(--gold);font-weight:700}
#ov{position:absolute;left:0;top:0;will-change:transform}
#mapin{cursor:grab;touch-action:none}#mapin.drag{cursor:grabbing}
#mini{position:absolute;right:10px;top:10px;padding:4px;background:#140f1ce6;border:2px solid #5a4a6e;border-radius:8px;box-shadow:0 3px 0 #0008}
#minic{width:180px;height:75px;display:block;border-radius:4px;cursor:pointer}
#mini .hint{font-size:11px;color:var(--mut);text-align:center;margin-top:3px}
.arr{position:absolute;width:40px;height:40px;border-radius:50%;border:2px solid #f2c14ebb;background:#140f1cd8;color:var(--gold);font-family:'Pixelify Sans';font-size:26px;line-height:32px;cursor:pointer;transition:opacity .25s;box-shadow:0 3px 0 #0008}
.arr:hover{background:#2c2440;border-color:var(--gold)}
.arr.l{left:10px;top:50%;margin-top:-20px}.arr.r{right:10px;top:50%;margin-top:-20px}.arr.u{left:50%;top:10px;margin-left:-20px}.arr.d{left:50%;bottom:10px;margin-left:-20px}
.arr.off{opacity:0;pointer-events:none}
.pin.locked .plate .st{color:#b0a8c0;font-size:11px;letter-spacing:0}
#go.lockd{background:linear-gradient(#6a6278,#4a4458);box-shadow:0 6px 0 #2a2434;color:#d8d0e4;text-shadow:none;animation:none}#go.lockd small{color:#b8b0c4}
</style></head><body>
<div id="stage">
 <div id="top">
  <div class="title px">Štvrť</div>
  <div class="chip"><small>noc</small><b class="px" style="font-size:20px">23</b></div>
  <div class="chip"><canvas id="moon" width="16" height="16" style="width:28px;height:28px"></canvas><span>Spln o <b>2</b> noci <small>– všetci bossovia naraz</small></span></div>
  <div class="chip nem"><canvas id="nemc" width="28" height="28" style="width:32px;height:32px"></canvas><span class="px">Kráľ potkanov</span><small style="color:#ff8a7a">„Zabijak Mici"</small></div>
  <div class="modes"><span class="on">Správy</span><span>Jedna noc</span></div>
  <div class="chip gold"><canvas id="coin" width="9" height="9" style="width:18px;height:18px"></canvas><span class="px" style="font-size:20px">1 240</span></div>
 </div>
 <div id="mapwrap"><div id="mapin"><canvas id="map" width="440" height="250"></canvas><div id="vig"></div><div id="ov"></div>
  <div id="mini"><canvas id="minic" width="180" height="75"></canvas><div class="hint">ťahaj myšou · šípky · WASD</div></div>
  <button class="arr l" data-d="-1,0">‹</button><button class="arr r" data-d="1,0">›</button><button class="arr u" data-d="0,-1">˄</button><button class="arr d" data-d="0,1">˅</button>
  <div class="legend"><span><b style="background:#c0392b">!</b>obrana</span><span><b style="background:#d49a1c">⇄</b>nočná túra</span><span><b style="background:#2f8a6a">$</b>príležitosť</span><span style="color:#bff0dc">■ tvoje</span><span style="color:#ffb0a0">■ bossovia</span></div>
 </div></div>
 <div id="panel">
  <div id="thumbw"><canvas id="thumb" width="110" height="50"></canvas><div id="badge"></div><div id="ptitle"></div></div>
  <div class="pbody">
   <div id="story"></div>
   <div class="boss"><canvas id="bossc" width="28" height="28"></canvas><div><div class="bn" id="bn"></div><div class="bt" id="bt"></div></div></div>
   <div class="stats"><div class="stat"><small>Náročnosť</small><span id="sdiff"></span></div><div class="stat"><small>Dĺžka</small><span id="slen"></span></div>
    <div class="stat"><small>Príbehy</small><span id="ssto"></span></div><div class="stat"><small>Hviezdy</small><span id="sstar" style="color:var(--gold)"></span></div></div>
   <div class="box win"><small>Výhra</small><span id="win"></span></div>
   <div class="box lose" id="losew"><small>Ak nepôjdeš</small><span id="lose"></span></div>
  </div>
 </div>
 <div id="bottom"><div id="cats"></div>
  <div id="catinfo"><div class="n" id="cn"></div><div class="h" id="ch"></div><div class="w" id="cw"></div></div>
  <button id="go"><span id="gol">Brániť</span><small id="gos"></small></button>
 </div>
</div>
